server:
  port: 8087

spring:
  application:
    name: ms-campuslab-kafka-admin

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8080/realms/campuslab}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:34.201.119.90:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    kafka:
      enabled: false

logging:
  level:
    com.campuslab.kafkaadmin: INFO
